<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Landing QA harness</title>
<style>body{margin:0;background:#333;font:14px system-ui;color:#eee}#bar{padding:8px;display:flex;gap:8px;align-items:center}button{padding:6px 10px}#stage{display:flex;justify-content:center;padding:12px}iframe{border:0;box-shadow:0 0 24px rgba(0,0,0,.5);background:#fff}</style>
</head><body>
<div id="bar"><span>Width:</span><span id="btns"></span></div>
<div id="stage"><iframe id="f" src="/"></iframe></div>
<script>
const widths=[360,390,430,768,820,1024,1280,1440,1920];
const bar=document.getElementById('btns');const f=document.getElementById('f');
function setW(w){f.style.width=w+'px';f.style.height=Math.min(900,Math.max(640,innerHeight-80))+'px';document.title='w='+w;[...bar.children].forEach(b=>b.style.background=(b.dataset.w==w)?'#49B87A':'#555');}
widths.forEach(w=>{const b=document.createElement('button');b.textContent=w;b.dataset.w=w;b.style.color='#fff';b.style.background='#555';b.onclick=()=>setW(w);bar.appendChild(b);});
const q=new URLSearchParams(location.search);setW(parseInt(q.get('w')||'390'));
</script></body></html>
